name: Sync Profile Unified (Safe Fix)

permissions:
  contents: write

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  sync_and_patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mon fork
        uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 0

      - name: Configurer Git
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'

      - name: Vérifier l'origine (Upstream)
        id: check
        run: |
          git remote add upstream https://github.com/Dictionarry-Hub/database.git
          git fetch upstream
          UPSTREAM_COMMIT=$(git rev-parse upstream/stable)
          LAST_PROCESSED=$(git log -1 --pretty=%B | grep -o '\[upstream:.*\]' | sed 's/\[upstream://;s/\]//' || echo "none")
          
          if [ "$UPSTREAM_COMMIT" == "$LAST_PROCESSED" ]; then
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            echo "updated=true" >> $GITHUB_OUTPUT
            echo "commit_hash=$UPSTREAM_COMMIT" >> $GITHUB_OUTPUT
          fi

      - name: Nettoyage et Récupération Ciblée
        if: steps.check.outputs.updated == 'true'
        run: |
          # 1. On récupère juste le fichier qu'on veut (sans casser le reste)
          git checkout upstream/stable -- "profiles/2160p Remux.yml"
          
          # 2. On supprime le doublon Sonarr qu'on avait créé avant
          rm -f "profiles/2160p Remux (Sonarr).yml"

      - name: Injecter Raw-HD (Compatible Radarr & Sonarr)
        if: steps.check.outputs.updated == 'true'
        shell: python
        run: |
          import sys
          import re

          file_path = 'profiles/2160p Remux.yml'
          # ID fictif 9001, mais Nom "Raw-HD" qui est reconnu par tout le monde
          FAKE_ID = 9001
          QUALITY_NAME = "Raw-HD"
          
          try:
              with open(file_path, 'r') as f:
                  content = f.read()
                  lines = content.splitlines(keepends=True)

              # 1. FORCER L'UPGRADE ALLOWED
              if 'upgradeAllowed: false' in content:
                  content = content.replace('upgradeAllowed: false', 'upgradeAllowed: true')

              # 2. MODIFIER LE CUTOFF POUR VISER Raw-HD
              # On remplace l'ID et le Nom dans le bloc upgrade_until
              pattern_upgrade = r"(upgrade_until:\s*\r?\n)(\s+id:\s*-?\d+\s*\r?\n)(\s+name:.*)"
              replacement = f"upgrade_until:\n  id: {FAKE_ID}\n  name: {QUALITY_NAME}"
              
              if re.search(pattern_upgrade, content):
                  content = re.sub(pattern_upgrade, replacement, content)
              else:
                  # Fallback
                  content = re.sub(r'^cutoff:\s*-?\d+', f'cutoff: {FAKE_ID}', content, flags=re.MULTILINE)

              # On prépare les lignes pour l'insertion
              lines = content.splitlines(keepends=True)
              new_lines = []
              inserted = False
              
              # 3. INSERER Raw-HD EN HAUT DE LA LISTE
              for i, line in enumerate(lines):
                  new_lines.append(line)
                  if not inserted and line.strip() == 'qualities:':
                      # Détection de l'indentation
                      detected_indent = "  "
                      for next_line in lines[i+1:]:
                          stripped = next_line.strip()
                          if stripped.startswith('-'):
                              detected_indent = next_line[:next_line.find('-')]
                              break
                      
                      sub_indent = detected_indent + "  "
                      sub_sub_indent = sub_indent + "    "
                      
                      block_to_insert = (
                          f"{detected_indent}- id: {FAKE_ID}\n"
                          f"{sub_indent}name: {QUALITY_NAME}\n"
                          f"{sub_indent}allowed: true\n"
                          f"{sub_indent}qualities:\n"
                          f"{sub_sub_indent}- id: {FAKE_ID}\n"
                          f"{sub_sub_indent}  name: {QUALITY_NAME}\n"
                      )
                      new_lines.append(block_to_insert)
                      inserted = True

              with open(file_path, 'w') as f:
                  f.writelines(new_lines)
              print(f"SUCCESS: {QUALITY_NAME} injecté.")
                  
          except Exception as e:
              print(f"Erreur Python: {e}")
              sys.exit(1)

      - name: Commit et Push
        if: steps.check.outputs.updated == 'true'
        run: |
          git add .
          git commit -m "Auto-update: Unified Raw-HD Profile [upstream:${{ steps.check.outputs.commit_hash }}]"
          git push origin stable
          
