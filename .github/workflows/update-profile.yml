name: Sync Profile (Raw-HD Final)

permissions:
  contents: write

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  sync_and_patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mon fork
        uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 0

      - name: Configurer Git
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'

      - name: Reset & Clean (Base saine)
        run: |
          # On repart sur la version officielle pour éviter les doublons
          git remote add upstream https://github.com/Dictionarry-Hub/database.git || true
          git fetch upstream
          git checkout upstream/stable -- "profiles/2160p Remux.yml"
          
          # On supprime les vieux fichiers qui foutent la merde (s'ils existent)
          rm -f "profiles/2160p Remux (Sonarr).yml"

      - name: Injection Raw-HD (Compatible Radarr & Sonarr)
        shell: python
        run: |
          import sys
          import re

          file_path = 'profiles/2160p Remux.yml'
          
          # ON UTILISE RAW-HD (ID FICTIF 9001 POUR LE LIEN)
          # C'est la clé : Raw-HD existe partout, donc pas d'erreur "Quality Not Found"
          FAKE_ID = 9001
          QUALITY_NAME = "Raw-HD"
          
          try:
              with open(file_path, 'r') as f:
                  content = f.read()
                  lines = content.splitlines(keepends=True)

              # 1. FORCER L'UPGRADE ALLOWED
              if 'upgradeAllowed: false' in content:
                  content = content.replace('upgradeAllowed: false', 'upgradeAllowed: true')

              # 2. MODIFIER LE CUTOFF POUR VISER Raw-HD
              # On remplace l'ID et le Nom dans le bloc upgrade_until
              pattern_upgrade = r"(upgrade_until:\s*\r?\n)(\s+id:\s*-?\d+\s*\r?\n)(\s+name:.*)"
              replacement = f"upgrade_until:\n  id: {FAKE_ID}\n  name: {QUALITY_NAME}"
              
              if re.search(pattern_upgrade, content):
                  content = re.sub(pattern_upgrade, replacement, content)
              else:
                  # Fallback standard
                  content = re.sub(r'^cutoff:\s*-?\d+', f'cutoff: {FAKE_ID}', content, flags=re.MULTILINE)

              # 3. INSERER Raw-HD EN HAUT DE LA LISTE
              lines = content.splitlines(keepends=True)
              new_lines = []
              inserted = False
              
              for i, line in enumerate(lines):
                  new_lines.append(line)
                  if not inserted and line.strip() == 'qualities:':
                      # Détection de l'indentation
                      detected_indent = "  "
                      for next_line in lines[i+1:]:
                          stripped = next_line.strip()
                          if stripped.startswith('-'):
                              detected_indent = next_line[:next_line.find('-')]
                              break
                      
                      sub_indent = detected_indent + "  "
                      sub_sub_indent = sub_indent + "    "
                      
                      # Bloc à insérer (Raw-HD)
                      block_to_insert = (
                          f"{detected_indent}- id: {FAKE_ID}\n"
                          f"{sub_indent}name: {QUALITY_NAME}\n"
                          f"{sub_indent}allowed: true\n"
                          f"{sub_indent}qualities:\n"
                          f"{sub_sub_indent}- id: {FAKE_ID}\n"
                          f"{sub_sub_indent}  name: {QUALITY_NAME}\n"
                      )
                      new_lines.append(block_to_insert)
                      inserted = True

              with open(file_path, 'w') as f:
                  f.writelines(new_lines)
              print(f"SUCCESS: {QUALITY_NAME} injecté.")
                  
          except Exception as e:
              print(f"Erreur Python: {e}")
              sys.exit(1)

      - name: Commit et Push (Avec Sécurité)
        run: |
          git add .
          # Le "|| echo" empêche le script de planter si rien n'a changé
          git commit -m "Auto-update: Switch to Raw-HD [Final Fix]" || echo "Rien à modifier, tout est déjà jour."
          git push origin stable
          
